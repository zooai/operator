apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zoogateways.zoo.network
spec:
  group: zoo.network
  scope: Namespaced
  names:
    plural: zoogateways
    singular: zoogateway
    kind: ZooGateway
    shortNames:
      - zoogw
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Host
          type: string
          jsonPath: .spec.hosts[0]
        - name: Routes
          type: integer
          jsonPath: .status.routeCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: ZooGateway manages API gateway/ingress for Zoo RPC endpoints.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
