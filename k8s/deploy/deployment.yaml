apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoo-operator
  namespace: zoo-system
  labels:
    app.kubernetes.io/name: zoo-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zoo-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoo-operator
    spec:
      serviceAccountName: zoo-operator
      containers:
        - name: zoo-operator
          image: ghcr.io/zoo-labs/operator:latest
          args:
            - --leader-election=true
            - --log-level=info
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
